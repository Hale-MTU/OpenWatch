# The release version, read by app/ and wear/ (one listing, one release). The
# phone app ships versionCode N, the watch 2000000000 + N. scripts/release.sh
# patches these two lines; the pipeline overrides them per build with
# OPENWATCH_VERSION_CODE / OPENWATCH_VERSION_NAME.
openwatch.versionCode=18
openwatch.versionName=0.5.0
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Task outputs are reused across builds. In CI, gradle/actions/setup-gradle keeps
# the cache directory between runs, so a release build of a commit main already
# verified restores its test and lint results instead of redoing them.
org.gradle.caching=true
# A repository that answers "too many requests" or a server error is asked again:
# Gradle's default is three tries about three seconds apart in all, which a rate
# limit outlasts (it failed a verify run on main). Six tries from two seconds
# wait up to a minute before the build gives up.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.disallowKotlinSourceSets=false
