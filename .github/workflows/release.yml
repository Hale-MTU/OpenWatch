# The release. One run builds the signed artifacts once and ships them from
# its own artifact, through to production.
#
# Ways in: the 00:00 UTC schedule and a manual run with target "nightly" make
# a nightly; a pushed vX.Y.Z / VX.Y.Z tag makes a version; a manual run with
# target "production", started from a tag, is the fallback for a tag whose run
# is gone (its approval lapsed, or it predates this workflow): its build job
# downloads the AAB from that tag's GitHub prerelease instead of building,
# checks the sha256, and stage 3 runs on it.
#
#   context: the commit must have passed the verify workflow (verify.yml) on
#     its push to main. A run still going is waited for; none, or a failed
#     one, stops the release with the reason.
#   build: signs the phone APK, the debug APK and the AAB, and the watch APK
#     and AAB, once; they are the run's release-build artifact, which every
#     job after it ships as it is. Both form factors share the applicationId
#     and the key; the watch's versionCode is 2000000000 + the phone's.
#   nightly: moves the `nightly` tag, then updates the nightly GitHub
#     prerelease beside the Play testing upload, then prunes old releases.
#   version: publishes the GitHub prerelease beside the testing upload,
#     waits for the `production` environment's approval, then promotes the
#     version to the production track and the prerelease to stable, in
#     parallel, and announces on Zulip. Nothing is rebuilt or re-signed.
#
# Two repository variables hold Play back. OPENWATCH_PLAY_INTERNAL_ONLY=true
# is for before Google has approved the app: every testing upload goes to the
# internal testing track (internal, wear:internal), the one track Play serves
# without a review, and the production job uploads nothing; open testing and
# production are not touched until the variable is deleted.
# OPENWATCH_PLAY_PAUSED=true holds every Play upload, the internal one
# included, for while a release sits in Play review: a new upload would
# restart it. Under either, the GitHub releases and the announcement go on.
# Play uploads go to the phone track and the Wear OS form-factor track
# (wear:internal, wear:beta, wear:production), one fastlane run each.
#
# scripts/ci-release-context.sh decides the release details from
# OPENWATCH_RELEASE_EVENT and writes them to build/release-ci/, which the jobs
# hand to each other as the release-context artifact.
name: release

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    tags: ["v*", "V*"]
  workflow_dispatch:
    inputs:
      target:
        description: "nightly publishes a nightly build; production ships the vX.Y.Z tag this run is started from, from its prerelease's AAB"
        type: choice
        options: [nightly, production]
        default: nightly

permissions:
  contents: read

# One nightly at a time, so two runs never mint a versionCode against the same
# survey. A tag, and a production promotion, each get their own lane.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || inputs.target || 'nightly' }}
  cancel-in-progress: false

env:
  # cron | manual | tag | deployment, the vocabulary the release scripts use.
  OPENWATCH_RELEASE_EVENT: ${{ github.event_name == 'schedule' && 'cron' || github.event_name == 'push' && 'tag' || inputs.target == 'production' && 'deployment' || 'manual' }}
  FASTLANE_DISABLE_COLORS: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  FASTLANE_SKIP_UPDATE_CHECK: "1"

defaults:
  run:
    shell: bash

jobs:
  # What kind of run this is and the release details; and the check that the
  # commit passed the gate.
  context:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # The gate check lists the verify workflow's runs.
      actions: read
    outputs:
      # nightly | tag | promote
      kind: ${{ steps.kind.outputs.kind }}
      # Stage 2 builds (a nightly with something to publish, or a tag), or, for
      # a promotion, takes the artifacts from the prerelease.
      build: ${{ steps.plan.outputs.build }}
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The nightly skip check and the tag lookup need history and tags.
          fetch-depth: 0

      - id: kind
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$EVENT" in
            schedule) kind=nightly ;;
            workflow_dispatch) if [ "$TARGET" = "production" ]; then kind=promote; else kind=nightly; fi ;;
            push) kind=tag ;;
            *) echo "unexpected event $EVENT" >&2; exit 1 ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "::notice::run kind: $kind"

      # The release details. A cron nightly with nothing new to publish ends
      # the run here.
      - id: release
        env:
          # version-code.sh reads release markers through the API.
          GH_TOKEN: ${{ github.token }}
          # Names the testing track in the context the jobs share.
          OPENWATCH_PLAY_INTERNAL_ONLY: ${{ vars.OPENWATCH_PLAY_INTERNAL_ONLY }}
        run: |
          sh scripts/ci-release-context.sh
          . build/release-ci/release-context.env
          {
            echo "skip=$OPENWATCH_SKIP_NIGHTLY"
            echo "channel=$OPENWATCH_RELEASE_CHANNEL"
            echo "tag=$OPENWATCH_RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"
          if [ "$OPENWATCH_SKIP_NIGHTLY" = "true" ]; then
            echo "::notice::Skipping: cron nightly has nothing new to publish."
          fi

      # A tag and the nightly are cut from a commit on main, whose push ran the
      # verify workflow. That run is the gate: still going, it is waited for;
      # passed, the build goes ahead; none, or failed, and the release stops.
      # Only a push run counts: a pull request run passes without lint. The
      # run's jobs that its paths did not touch (lint, wear-test) are skipped
      # and still leave the run successful. An annotated tag's GITHUB_SHA is
      # the tag object, hence the rev-parse.
      - id: verified
        if: steps.kind.outputs.kind != 'promote' && steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$commit&event=push&per_page=5"
          run_id="$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")][0].id // empty')"
          if [ -n "$run_id" ]; then
            echo "verify run $run_id is still going for $commit; waiting for it."
            gh run watch "$run_id" > /dev/null || true
          fi
          run_url="$(gh api "$runs&status=success" --jq '.workflow_runs[0].html_url // empty')"
          if [ -z "$run_url" ]; then
            echo "::error::$commit has not passed the verify workflow on a push to main. Push it to main (or fix that run) and start the release again."
            exit 1
          fi
          echo "::notice::$commit passed the gate: $run_url"

      - id: plan
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          SKIP: ${{ steps.release.outputs.skip }}
        run: |
          build=true
          if [ "$KIND" = "nightly" ] && [ "$SKIP" = "true" ]; then build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "plan: build=$build"

      - uses: actions/upload-artifact@v7
        with:
          name: release-context
          path: build/release-ci/
          retention-days: 7

  # The one signed build of the run. Its outputs are the release-build artifact
  # every later job, stage 3 included, ships as they are. A manual production
  # run builds nothing: it takes the AAB from the tag's GitHub prerelease, where
  # a tag run put it, and checks it against its sha256.
  build:
    needs: context
    if: needs.context.outputs.build == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release-context
          path: build/release-ci
      - if: needs.context.outputs.kind != 'promote'
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      # Read-only: a signing build never writes the cache other builds restore.
      - if: needs.context.outputs.kind != 'promote'
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Build signed artifacts
        if: needs.context.outputs.kind != 'promote'
        env:
          OPENWATCH_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPENWATCH_RELEASE_KEYSTORE_BASE64 }}
          OPENWATCH_RELEASE_STORE_PASSWORD: ${{ secrets.OPENWATCH_RELEASE_STORE_PASSWORD }}
          OPENWATCH_RELEASE_KEY_ALIAS: ${{ secrets.OPENWATCH_RELEASE_KEY_ALIAS }}
          OPENWATCH_RELEASE_KEY_PASSWORD: ${{ secrets.OPENWATCH_RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          . build/release-ci/release-context.env
          test -n "$OPENWATCH_RELEASE_KEYSTORE_BASE64"
          test -n "$OPENWATCH_RELEASE_STORE_PASSWORD"
          test -n "$OPENWATCH_RELEASE_KEY_ALIAS"
          # Outside the workspace, so the keystore never lands in an artifact.
          keystore_path="$RUNNER_TEMP/openwatch-release.p12"
          printf '%s' "$OPENWATCH_RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          export OPENWATCH_RELEASE_STORE_FILE="$keystore_path"
          export OPENWATCH_RELEASE_KEY_PASSWORD="$OPENWATCH_RELEASE_STORE_PASSWORD"
          keytool -list -storetype PKCS12 -keystore "$keystore_path" -storepass "$OPENWATCH_RELEASE_STORE_PASSWORD" -alias "$OPENWATCH_RELEASE_KEY_ALIAS" >/dev/null
          export OPENWATCH_SIGN_DEBUG_WITH_RELEASE_KEY=true
          export OPENWATCH_PUBLISHED_DEBUG_APK=true
          if [ -n "${OPENWATCH_VERSION_CODE:-}" ]; then export OPENWATCH_VERSION_CODE; fi
          if [ -n "${OPENWATCH_VERSION_NAME:-}" ]; then export OPENWATCH_VERSION_NAME; fi
          if [ -n "${OPENWATCH_WEAR_VERSION_CODE:-}" ]; then export OPENWATCH_WEAR_VERSION_CODE; fi
          if [ -n "${OPENWATCH_WEAR_VERSION_NAME:-}" ]; then export OPENWATCH_WEAR_VERSION_NAME; fi
          test -n "$OPENWATCH_APK_ABI_FILTERS"

          set -- "$OPENWATCH_GRADLE_TASK"
          if [ "$OPENWATCH_BUILD_AAB" = "true" ]; then
            set -- "$@" "$OPENWATCH_BUNDLE_TASK"
          fi
          if [ "$OPENWATCH_BUILD_DEBUG_APK" = "true" ]; then
            set -- "$@" ":app:assembleDebug"
          fi
          # The watch app in the same invocation: one configuration, one key.
          if [ "$OPENWATCH_BUILD_WEAR" = "true" ]; then
            set -- "$@" "$OPENWATCH_WEAR_GRADLE_TASK" "$OPENWATCH_WEAR_BUNDLE_TASK"
          fi
          env OPENWATCH_APK_ABI_FILTERS="$OPENWATCH_APK_ABI_FILTERS" scripts/ci-android-gradle.sh --stacktrace "$@"

          out=build/release-ci
          apk_path="$(find "app/build/outputs/apk/$OPENWATCH_APK_VARIANT_DIR" -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" "$out/$OPENWATCH_APK_BASENAME"
          (cd "$out" && sha256sum "$OPENWATCH_APK_BASENAME" > "$OPENWATCH_APK_BASENAME.sha256")
          if [ "$OPENWATCH_BUILD_DEBUG_APK" = "true" ]; then
            debug_apk_path="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
            test -n "$debug_apk_path"
            cp "$debug_apk_path" "$out/$OPENWATCH_DEBUG_APK_BASENAME"
            (cd "$out" && sha256sum "$OPENWATCH_DEBUG_APK_BASENAME" > "$OPENWATCH_DEBUG_APK_BASENAME.sha256")
          fi
          if [ "$OPENWATCH_BUILD_AAB" = "true" ]; then
            aab_path="$(find "app/build/outputs/bundle/$OPENWATCH_AAB_VARIANT_DIR" -maxdepth 1 -name '*.aab' | head -n 1)"
            test -n "$aab_path"
            cp "$aab_path" "$out/$OPENWATCH_AAB_BASENAME"
            (cd "$out" && sha256sum "$OPENWATCH_AAB_BASENAME" > "$OPENWATCH_AAB_BASENAME.sha256")
          fi
          if [ "$OPENWATCH_BUILD_WEAR" = "true" ]; then
            wear_apk_path="$(find "wear/build/outputs/apk/$OPENWATCH_WEAR_VARIANT_DIR" -maxdepth 1 -name '*.apk' | head -n 1)"
            test -n "$wear_apk_path"
            cp "$wear_apk_path" "$out/$OPENWATCH_WEAR_APK_BASENAME"
            (cd "$out" && sha256sum "$OPENWATCH_WEAR_APK_BASENAME" > "$OPENWATCH_WEAR_APK_BASENAME.sha256")
            wear_aab_path="$(find "wear/build/outputs/bundle/$OPENWATCH_WEAR_VARIANT_DIR" -maxdepth 1 -name '*.aab' | head -n 1)"
            test -n "$wear_aab_path"
            cp "$wear_aab_path" "$out/$OPENWATCH_WEAR_AAB_BASENAME"
            (cd "$out" && sha256sum "$OPENWATCH_WEAR_AAB_BASENAME" > "$OPENWATCH_WEAR_AAB_BASENAME.sha256")
          fi
      - name: Take the artifacts from the tag's prerelease (no build)
        if: needs.context.outputs.kind == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          . build/release-ci/release-context.env
          test -n "$OPENWATCH_AAB_BASENAME"
          test -n "$OPENWATCH_WEAR_AAB_BASENAME"
          gh release download "$OPENWATCH_RELEASE_TAG" \
            --pattern "$OPENWATCH_AAB_BASENAME" --pattern "$OPENWATCH_AAB_BASENAME.sha256" \
            --pattern "$OPENWATCH_WEAR_AAB_BASENAME" --pattern "$OPENWATCH_WEAR_AAB_BASENAME.sha256" \
            --dir build/release-ci
          (cd build/release-ci && sha256sum -c "$OPENWATCH_AAB_BASENAME.sha256" "$OPENWATCH_WEAR_AAB_BASENAME.sha256")
          echo "::notice::shipping $OPENWATCH_AAB_BASENAME and $OPENWATCH_WEAR_AAB_BASENAME from the $OPENWATCH_RELEASE_TAG prerelease, versionCodes $OPENWATCH_VERSION_CODE and $OPENWATCH_WEAR_VERSION_CODE"
      - uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: build/release-ci/
          retention-days: 30

  # --- the nightly branch

  # Nightly keeps a single stable download page, so the `nightly` tag is
  # force-moved to this commit. The versionCode is recorded to an append-only
  # ref first, and a code that has gone backwards fails here instead of shipping
  # an APK that will not install (2026-07). See scripts/move-nightly-tag.sh.
  nightly-tag:
    needs: [context, build]
    # Every job from here on names the result it needs: GitHub also skips a
    # job with a plain `if` when a job upstream in its chain was skipped.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.context.outputs.channel == 'nightly'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: build/release-ci
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . build/release-ci/release-context.env
          scripts/move-nightly-tag.sh nightly "$GITHUB_SHA" "OpenWatch nightly $GITHUB_RUN_NUMBER" "$OPENWATCH_VERSION_CODE"

  nightly-github-prerelease:
    needs: [context, nightly-tag]
    if: ${{ !cancelled() && needs.nightly-tag.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: build/release-ci
      - uses: ./.github/actions/publish-github-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Beside the prerelease, not after it: a Play refusal must not hold the
  # download page back. Open testing, or internal testing while
  # OPENWATCH_PLAY_INTERNAL_ONLY holds.
  nightly-play-testing:
    needs: [context, nightly-tag]
    if: ${{ !cancelled() && needs.nightly-tag.result == 'success' && vars.OPENWATCH_PLAY_PAUSED != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: build/release-ci
      - uses: ./.github/actions/play-upload
        with:
          lane: ${{ vars.OPENWATCH_PLAY_INTERNAL_ONLY == 'true' && 'internal_testing' || 'open_testing' }}
          service-account-json-base64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          changes-not-sent-for-review: ${{ vars.OPENWATCH_PLAY_CHANGES_NOT_SENT_FOR_REVIEW }}
      - uses: ./.github/actions/play-upload
        with:
          lane: ${{ vars.OPENWATCH_PLAY_INTERNAL_ONLY == 'true' && 'internal_testing' || 'open_testing' }}
          form-factor: wear
          service-account-json-base64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          changes-not-sent-for-review: ${{ vars.OPENWATCH_PLAY_CHANGES_NOT_SENT_FOR_REVIEW }}

  prune-github-releases:
    needs: [context, nightly-github-prerelease]
    if: ${{ !cancelled() && needs.nightly-github-prerelease.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: "false"
          KEEP_RELEASES: "9"
        run: scripts/prune-github-releases.sh

  # --- the version branch

  version-github-prerelease:
    needs: [context, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.context.outputs.kind == 'tag' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: build/release-ci
      - uses: ./.github/actions/publish-github-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # The version goes to open testing now (internal testing while
  # OPENWATCH_PLAY_INTERNAL_ONLY holds); stage 3 promotes it from there.
  version-play-testing:
    needs: [context, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.context.outputs.kind == 'tag' && vars.OPENWATCH_PLAY_PAUSED != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: build/release-ci
      - uses: ./.github/actions/play-upload
        with:
          lane: ${{ vars.OPENWATCH_PLAY_INTERNAL_ONLY == 'true' && 'internal_testing' || 'open_testing' }}
          service-account-json-base64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          changes-not-sent-for-review: ${{ vars.OPENWATCH_PLAY_CHANGES_NOT_SENT_FOR_REVIEW }}
      - uses: ./.github/actions/play-upload
        with:
          lane: ${{ vars.OPENWATCH_PLAY_INTERNAL_ONLY == 'true' && 'internal_testing' || 'open_testing' }}
          form-factor: wear
          service-account-json-base64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          changes-not-sent-for-review: ${{ vars.OPENWATCH_PLAY_CHANGES_NOT_SENT_FOR_REVIEW }}

  # The gate: this job holds the `production` environment, so the run waits here
  # for its required reviewers. A tag run reaches it from its prerelease (the
  # testing upload may be paused); a manual production run straight from
  # the artifacts its build job fetched.
  production-approval:
    needs: [context, build, version-github-prerelease, version-play-testing]
    if: >-
      !cancelled()
      && (
        (
          needs.context.outputs.kind == 'tag'
          && needs.version-github-prerelease.result == 'success'
          && (needs.version-play-testing.result == 'success' || needs.version-play-testing.result == 'skipped')
        )
        || (needs.context.outputs.kind == 'promote' && needs.build.result == 'success')
      )
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - env:
          RELEASE_TAG: ${{ needs.context.outputs.tag }}
        run: echo "::notice::$RELEASE_TAG approved for production"

  github-stable:
    needs: [context, production-approval]
    if: ${{ !cancelled() && needs.production-approval.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.context.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --prerelease=false --draft=false --latest

  # Promotes the version from the testing track that has it (open testing, or
  # internal testing) to production, with the store metadata; a version no
  # testing track had (Play was paused) is uploaded instead. The phone first,
  # then the watch on its wear: tracks; the listing is shared, so the phone
  # run carries the metadata. While Play is paused, or internal-only before
  # Google's approval, the job runs and does nothing, so the announcement
  # still follows.
  play-production:
    needs: [context, production-approval]
    if: ${{ !cancelled() && needs.production-approval.result == 'success' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: build/release-ci
      - if: vars.OPENWATCH_PLAY_PAUSED == 'true'
        run: |
          echo "::notice::Google Play is paused (OPENWATCH_PLAY_PAUSED=true): no upload. Both AABs are on the GitHub release."
      - if: vars.OPENWATCH_PLAY_PAUSED != 'true' && vars.OPENWATCH_PLAY_INTERNAL_ONLY == 'true'
        run: |
          echo "::notice::Google Play is internal-only (OPENWATCH_PLAY_INTERNAL_ONLY=true): the version stays on internal testing, no production upload. Delete the variable once Google has approved the app, then run the workflow from the tag with target production."
      - if: vars.OPENWATCH_PLAY_PAUSED != 'true' && vars.OPENWATCH_PLAY_INTERNAL_ONLY != 'true'
        uses: ./.github/actions/play-upload
        with:
          lane: production
          service-account-json-base64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          changes-not-sent-for-review: ${{ vars.OPENWATCH_PLAY_CHANGES_NOT_SENT_FOR_REVIEW }}
      - if: vars.OPENWATCH_PLAY_PAUSED != 'true' && vars.OPENWATCH_PLAY_INTERNAL_ONLY != 'true'
        uses: ./.github/actions/play-upload
        with:
          lane: production
          form-factor: wear
          service-account-json-base64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          changes-not-sent-for-review: ${{ vars.OPENWATCH_PLAY_CHANGES_NOT_SENT_FOR_REVIEW }}

  # After both promotions. The Zulip "releases" channel gets the full notes
  # under a vX.Y.Z topic; the script checks for an earlier post, so a re-run
  # never posts twice.
  announce-zulip:
    needs: [context, github-stable, play-production]
    if: ${{ !cancelled() && needs.github-stable.result == 'success' && needs.play-production.result == 'success' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release-context
          path: build/release-ci
      - env:
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
        run: |
          set -eu
          . build/release-ci/release-context.env
          test -n "$ZULIP_BOT_EMAIL"
          test -n "$ZULIP_BOT_API_KEY"
          LC_ALL=C.UTF-8 scripts/announce-zulip.sh "$OPENWATCH_RELEASE_TAG" build/release-ci/release-notes.md
