name: Google Play upload
description: >-
  Runs a fastlane lane against one of the AABs this run holds under
  build/release-ci (the phone's or the watch's), with its versionCode from
  release-context.env. The job has checked out the repository and downloaded
  the release-build artifact.
inputs:
  lane:
    description: open_testing or production
    required: true
  form-factor:
    description: phone (the default) or wear; picks the AAB, the versionCode and the Play track family
    required: false
    default: phone
  service-account-json-base64:
    description: the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 secret
    required: true
  changes-not-sent-for-review:
    description: the OPENWATCH_PLAY_CHANGES_NOT_SENT_FOR_REVIEW variable
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
        bundler-cache: true
    - shell: bash
      env:
        LANE: ${{ inputs.lane }}
        FORM_FACTOR: ${{ inputs.form-factor }}
        GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ inputs.service-account-json-base64 }}
        OPENWATCH_PLAY_CHANGES_NOT_SENT_FOR_REVIEW: ${{ inputs.changes-not-sent-for-review }}
      run: |
        set -eu
        . build/release-ci/release-context.env
        case "$FORM_FACTOR" in
          phone) aab_basename="$OPENWATCH_AAB_BASENAME"; version_code="$OPENWATCH_VERSION_CODE" ;;
          wear) aab_basename="$OPENWATCH_WEAR_AAB_BASENAME"; version_code="$OPENWATCH_WEAR_VERSION_CODE" ;;
          *) echo "form-factor must be phone or wear, got $FORM_FACTOR" >&2; exit 1 ;;
        esac
        test -n "$version_code"
        test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64"
        play_key_path="$RUNNER_TEMP/google-play-service-account.json"
        printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > "$play_key_path"
        test -s "$play_key_path"
        aab_path="$GITHUB_WORKSPACE/build/release-ci/$aab_basename"
        test -f "$aab_path"
        bundle exec fastlane android "$LANE" \
          json_key:"$play_key_path" \
          aab:"$aab_path" \
          version_code:"$version_code" \
          form_factor:"$FORM_FACTOR"
